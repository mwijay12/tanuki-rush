name: Android APK

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build Android preview
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write # Needed only by the opt-in preview release step below.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tanuki-rush/package-lock.json
      - name: Install and test game
        working-directory: tanuki-rush
        run: |
          npm ci --no-audit --no-fund
          npm test
      - name: Rebuild bundled offline game
        run: python3 tools/build_web_assets.py
      - name: Check committed assets are up to date
        run: |
          git diff --exit-code -- mobile/assets/web
          test -z "$(git ls-files --others --exclude-standard -- mobile/assets/web)"
      - name: Test bundled touch controls in Chrome
        working-directory: tanuki-rush
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: ../tools/ci_run.sh npm run test:touch
      - name: Test bundled audio recovery and BOOST mix in Chrome
        working-directory: tanuki-rush
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: ../tools/ci_run.sh npm run test:audio
      - name: Test bundled game over and revive in Chrome
        working-directory: tanuki-rush
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: ../tools/ci_run.sh npm run test:gameover
      - name: Test bundled native-storage bridge and migration in Chrome
        working-directory: tanuki-rush
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: ../tools/ci_run.sh npm run test:storage
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK components
        run: tools/ci_run.sh sdkmanager 'platforms;android-34' 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.3.13750724'
      - name: Resolve Flutter packages
        working-directory: mobile
        run: ../tools/ci_run.sh flutter pub get
      - name: Verify resolved Flutter lockfile
        working-directory: mobile
        run: ../tools/ci_run.sh git diff --exit-code -- pubspec.lock
      - name: Analyze Flutter app
        working-directory: mobile
        run: ../tools/ci_run.sh flutter analyze --no-pub
      - name: Test Flutter bridge, native storage UI and WebView settings
        working-directory: mobile
        run: ../tools/ci_run.sh flutter test --no-pub
      - name: Test asset server and stable origin
        working-directory: mobile
        run: ../tools/ci_run.sh dart run tool/verify_asset_server.dart
      - name: Fetch verified Gradle distribution
        run: tools/ci_run.sh tools/fetch_gradle_ci.sh
      - name: Build installable APK
        working-directory: mobile
        run: ../tools/ci_run.sh flutter build apk --release --no-pub --target-platform android-arm,android-arm64
      - name: Build x86_64 debug APK for the boot test
        working-directory: mobile
        run: ../tools/ci_run.sh flutter build apk --debug --no-pub --target-platform android-x64
      - name: Upload boot-test APK for newer-API jobs
        uses: actions/upload-artifact@v4
        with:
          name: boot-test-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Boot smoke test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: tools/ci_boot_test.sh
      - name: Upload boot failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: boot-failure
          path: |
            boot-failure.png
            boot-failure-logcat.txt
          if-no-files-found: ignore
          retention-days: 14
      - name: Test Android SQLite migrations, transactions and persistence
        working-directory: mobile/android
        run: ../../tools/ci_run.sh ./gradlew :app:testDebugUnitTest --no-daemon
      - name: Verify APK signature, package and ARM architectures
        run: |
          apk=mobile/build/app/outputs/flutter-apk/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" > "$RUNNER_TEMP/apk-badging.txt"
          grep -F "package: name='com.tanukirush.tanuki_rush'" "$RUNNER_TEMP/apk-badging.txt"
          unzip -Z -1 "$apk" > "$RUNNER_TEMP/apk-files.txt"
          grep -Fx 'lib/armeabi-v7a/libflutter.so' "$RUNNER_TEMP/apk-files.txt"
          grep -Fx 'lib/arm64-v8a/libflutter.so' "$RUNNER_TEMP/apk-files.txt"
          ls -lh "$apk"
      - name: Prepare APK
        run: |
          mkdir -p release
          cp mobile/build/app/outputs/flutter-apk/app-release.apk release/tanuki-rush-android-preview.apk
          sha256sum release/tanuki-rush-android-preview.apk > release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: tanuki-rush-android-preview
          path: release/*
          if-no-files-found: error
          retention-days: 30
      # A normal push only builds an artifact. Adding [release-preview] to a
      # push commit explicitly publishes a uniquely named GitHub pre-release.
      - name: Publish requested GitHub pre-release
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release-preview]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="preview-${GITHUB_SHA:0:10}"
          version=$(awk '/^version:/ {print $2}' mobile/pubspec.yaml)
          gh release create "$tag" release/tanuki-rush-android-preview.apk release/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --prerelease \
            --title "Tanuki Rush — Android preview $version (${GITHUB_SHA:0:7})" \
            --notes-file docs/PREVIEW_RELEASE.md

  # Diagnostic coverage for the field report (Pixel 8 Pro, Android 17). The hang
  # is intermittent rather than OS-specific: API 34 passed three times and then
  # reported "no first Flutter frame in 180s" (run 43547895180), while API 36
  # failed once on 1.0.5 and passed four times on 1.0.6. So this matrix samples
  # the newest images instead of assuming one of them is the culprit, and the
  # annotation carries the watchdog verdict. Each leg is independent
  # (fail-fast: false) so one bad image never hides the others. Trim this once
  # the hang is closed.
  #
  # API 37 is back. It was removed on the inference that no Android 17 image
  # exists on these runners, because both of its legs failed with no annotation
  # from the boot script. That inference was wrong: the script then ran
  # `adb install` under `set -e`, and run 43547900681 shows what that looks like
  # from the readable side - "Can't find service: package" on a cold emulator.
  # The script now waits for the package service and names its phase, so an
  # API 37 failure will say whether Android 17 is unavailable, unbootable, or
  # genuinely hanging before its first frame.
  boot-newer-apis:
    name: Boot test (API ${{ matrix.api }}, run ${{ matrix.attempt }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 36
            attempt: 1
          - api: 36
            attempt: 2
          - api: 37
            attempt: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - uses: actions/download-artifact@v4
        with:
          name: boot-test-apk
          path: apk
      - name: Boot smoke test on Android emulator (API ${{ matrix.api }}, run ${{ matrix.attempt }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          script: BOOT_TEST_APK=apk/app-debug.apk tools/ci_boot_test.sh
      - name: Upload boot failure diagnostics (API ${{ matrix.api }}, run ${{ matrix.attempt }})
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: boot-failure-api-${{ matrix.api }}-${{ matrix.attempt }}
          path: |
            boot-failure.png
            boot-failure-logcat.txt
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Is the pre-frame hang Impeller/Vulkan bring-up?
  #
  # Builds a second debug APK from an ephemeral checkout with
  # io.flutter.embedding.android.EnableImpeller=false injected by
  # tools/patch_disable_impeller.py, then boots it on the oldest and newest API
  # levels that have a working emulator image. Nothing here is shipped: the
  # committed manifest is never touched, so the released APK keeps Flutter's
  # default rasterizer. Reading the result needs both legs — an Impeller-off
  # build that fails on API 34 too means the opt-out is not a safe fallback,
  # while one that boots on both means it is available if the field report from
  # the native watchdog confirms a rasterizer hang.
  build-impeller-off:
    name: Build Impeller-off diagnostic APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK components
        run: tools/ci_run.sh sdkmanager 'platforms;android-34' 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.3.13750724'
      - name: Resolve Flutter packages
        working-directory: mobile
        run: ../tools/ci_run.sh flutter pub get
      - name: Fetch verified Gradle distribution
        run: tools/ci_run.sh tools/fetch_gradle_ci.sh
      - name: Inject the Impeller opt-out
        run: tools/ci_run.sh python3 tools/patch_disable_impeller.py
      - name: Build the diagnostic APK
        working-directory: mobile
        run: ../tools/ci_run.sh flutter build apk --debug --no-pub --target-platform android-x64
      - name: Confirm the opt-out reached the built manifest
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump xmltree \
            --file AndroidManifest.xml mobile/build/app/outputs/flutter-apk/app-debug.apk \
            | grep -A2 -F 'io.flutter.embedding.android.EnableImpeller'
      - uses: actions/upload-artifact@v4
        with:
          name: impeller-off-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  boot-impeller-off:
    name: Impeller-off boot test (API ${{ matrix.api }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: build-impeller-off
    strategy:
      fail-fast: false
      matrix:
        api: [34, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - uses: actions/download-artifact@v4
        with:
          name: impeller-off-apk
          path: apk
      - name: Boot smoke test with Impeller disabled (API ${{ matrix.api }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          script: BOOT_TEST_APK=apk/app-debug.apk tools/ci_boot_test.sh
      - name: Upload Impeller-off failure diagnostics (API ${{ matrix.api }})
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: boot-failure-impeller-off-api-${{ matrix.api }}
          path: |
            boot-failure.png
            boot-failure-logcat.txt
          if-no-files-found: ignore
          retention-days: 14
