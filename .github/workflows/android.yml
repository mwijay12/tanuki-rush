name: Android APK

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build Android preview
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # Needed only by the opt-in preview release step below.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tanuki-rush/package-lock.json
      - name: Install and test game
        working-directory: tanuki-rush
        run: |
          npm ci --no-audit --no-fund
          npm test
      - name: Rebuild bundled offline game
        run: python3 tools/build_web_assets.py
      - name: Check committed assets are up to date
        run: |
          git diff --exit-code -- mobile/assets/web
          test -z "$(git ls-files --others --exclude-standard -- mobile/assets/web)"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-34' 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.0.12077973'
      - name: Resolve Flutter packages
        working-directory: mobile
        run: flutter pub get
      - name: Analyze Flutter app
        working-directory: mobile
        run: flutter analyze --no-pub
      - name: Test asset server and stable origin
        working-directory: mobile
        run: dart run tool/verify_asset_server.dart
      - name: Build installable APK
        working-directory: mobile
        run: flutter build apk --release --no-pub --target-platform android-arm,android-arm64
      - name: Prepare APK
        run: |
          mkdir -p release
          cp mobile/build/app/outputs/flutter-apk/app-release.apk release/tanuki-rush-android-preview.apk
          sha256sum release/tanuki-rush-android-preview.apk > release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: tanuki-rush-android-preview
          path: release/*
          if-no-files-found: error
          retention-days: 30
      # A normal push only builds an artifact. Adding [release-preview] to a
      # push commit explicitly publishes a uniquely named GitHub pre-release.
      - name: Publish requested GitHub pre-release
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release-preview]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="preview-${GITHUB_SHA:0:10}"
          gh release create "$tag" release/tanuki-rush-android-preview.apk release/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --prerelease \
            --title "Tanuki Rush — Android preview ${GITHUB_SHA:0:7}" \
            --notes-file docs/PREVIEW_RELEASE.md
