name: Android APK

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build Android preview
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write # Needed only by the opt-in preview release step below.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tanuki-rush/package-lock.json
      - name: Install and test game
        working-directory: tanuki-rush
        run: |
          npm ci --no-audit --no-fund
          npm test
      - name: Rebuild bundled offline game
        run: python3 tools/build_web_assets.py
      - name: Check committed assets are up to date
        run: |
          git diff --exit-code -- mobile/assets/web
          test -z "$(git ls-files --others --exclude-standard -- mobile/assets/web)"
      - name: Test bundled touch controls in Chrome
        working-directory: tanuki-rush
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: ../tools/ci_run.sh npm run test:touch
      - name: Test bundled audio recovery and BOOST mix in Chrome
        working-directory: tanuki-rush
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: ../tools/ci_run.sh npm run test:audio
      - name: Test bundled game over and revive in Chrome
        working-directory: tanuki-rush
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: ../tools/ci_run.sh npm run test:gameover
      - name: Test bundled native-storage bridge and migration in Chrome
        working-directory: tanuki-rush
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: ../tools/ci_run.sh npm run test:storage
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK components
        run: tools/ci_run.sh sdkmanager 'platforms;android-34' 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.3.13750724'
      - name: Resolve Flutter packages
        working-directory: mobile
        run: ../tools/ci_run.sh flutter pub get
      - name: Verify resolved Flutter lockfile
        working-directory: mobile
        run: ../tools/ci_run.sh git diff --exit-code -- pubspec.lock
      - name: Analyze Flutter app
        working-directory: mobile
        run: ../tools/ci_run.sh flutter analyze --no-pub
      - name: Test Flutter bridge, native storage UI and WebView settings
        working-directory: mobile
        run: ../tools/ci_run.sh flutter test --no-pub
      - name: Test asset server and stable origin
        working-directory: mobile
        run: ../tools/ci_run.sh dart run tool/verify_asset_server.dart
      - name: Fetch verified Gradle distribution
        run: tools/ci_run.sh tools/fetch_gradle_ci.sh
      - name: Build installable APK
        working-directory: mobile
        run: ../tools/ci_run.sh flutter build apk --release --no-pub --target-platform android-arm,android-arm64
      - name: Build x86_64 debug APK for the boot test
        working-directory: mobile
        run: ../tools/ci_run.sh flutter build apk --debug --no-pub --target-platform android-x64
      - name: Upload boot-test APK for newer-API jobs
        uses: actions/upload-artifact@v4
        with:
          name: boot-test-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      # Deliberately NOT a gate, and that is a decision made from evidence rather
      # than convenience. This leg has failed 3 of its last 8 samples on product
      # code that boots fine elsewhere; on commit 60a7288 the pull_request run was
      # green on all seven jobs while the push run of the same commit failed here.
      # So a red result is an emulator verdict, not a build verdict. It also sat
      # before the release step, which is how two pushes to main published
      # nothing at all: a flaky emulator blocked the diagnostic APK that is needed
      # to chase the hang. The signal is kept - the ::error:: annotation still
      # carries the watchdog verdict, and the dedicated boot jobs below still fail
      # loudly - only the gating is removed.
      - name: Boot smoke test on Android emulator (diagnostic, non-blocking)
        id: boot-smoke
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: tools/ci_boot_test.sh
      - name: Upload boot diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-diagnostics
          path: |
            boot-failure.png
            boot-failure-logcat.txt
            boot-pass.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Test Android SQLite migrations, transactions and persistence
        working-directory: mobile/android
        run: ../../tools/ci_run.sh ./gradlew :app:testDebugUnitTest --no-daemon
      - name: Verify APK signature, package and ARM architectures
        run: |
          apk=mobile/build/app/outputs/flutter-apk/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" > "$RUNNER_TEMP/apk-badging.txt"
          grep -F "package: name='com.tanukirush.tanuki_rush'" "$RUNNER_TEMP/apk-badging.txt"
          unzip -Z -1 "$apk" > "$RUNNER_TEMP/apk-files.txt"
          grep -Fx 'lib/armeabi-v7a/libflutter.so' "$RUNNER_TEMP/apk-files.txt"
          grep -Fx 'lib/arm64-v8a/libflutter.so' "$RUNNER_TEMP/apk-files.txt"
          ls -lh "$apk"
      - name: Prepare APK
        run: |
          mkdir -p release
          cp mobile/build/app/outputs/flutter-apk/app-release.apk release/tanuki-rush-android-preview.apk
          sha256sum release/tanuki-rush-android-preview.apk > release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: tanuki-rush-android-preview
          path: release/*
          if-no-files-found: error
          retention-days: 30
      # A normal push only builds an artifact. Adding [release-preview] to a
      # push commit explicitly publishes a uniquely named GitHub pre-release.
      - name: Publish requested GitHub pre-release
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release-preview]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="preview-${GITHUB_SHA:0:10}"
          version=$(awk '/^version:/ {print $2}' mobile/pubspec.yaml)
          gh release create "$tag" release/tanuki-rush-android-preview.apk release/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --prerelease \
            --title "Tanuki Rush — Android preview $version (${GITHUB_SHA:0:7})" \
            --notes-file docs/PREVIEW_RELEASE.md

  # Diagnostic coverage for the field report (Pixel 8 Pro, Android 17). The hang
  # is intermittent rather than OS-specific: API 34 passed three times and then
  # reported "no first Flutter frame in 180s" (run 43547895180), while API 36
  # failed once on 1.0.5 and passed four times on 1.0.6. So this matrix samples
  # the newest images instead of assuming one of them is the culprit, and the
  # annotation carries the watchdog verdict. Each leg is independent
  # (fail-fast: false) so one bad image never hides the others. Trim this once
  # the hang is closed.
  #
  # API 37 is out for good, and this time the evidence is airtight. It was
  # dropped once, restored on the theory that the old script had died silently in
  # `adb install`, and run 43590007011 settled it: every failure path in
  # ci_boot_test.sh now emits `::error::BOOT TEST FAILED (<phase>)`, including
  # the emulator phase, and the API 37 leg still produced no annotation at all -
  # only the action's generic exit code 1. The script never ran, so
  # android-emulator-runner cannot bring up an API 37 image here. A leg that
  # cannot execute is not coverage. Android 15 (API 35) replaces it: untested so
  # far, and with the hang looking intermittent, another OS version is worth more
  # than a third sample of the same one.
  boot-newer-apis:
    name: Boot test (API ${{ matrix.api }}, run ${{ matrix.attempt }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 35
            attempt: 1
          - api: 36
            attempt: 1
          - api: 36
            attempt: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - uses: actions/download-artifact@v4
        with:
          name: boot-test-apk
          path: apk
      - name: Boot smoke test on Android emulator (API ${{ matrix.api }}, run ${{ matrix.attempt }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          script: BOOT_TEST_APK=apk/app-debug.apk tools/ci_boot_test.sh
      - name: Upload boot failure diagnostics (API ${{ matrix.api }}, run ${{ matrix.attempt }})
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: boot-failure-api-${{ matrix.api }}-${{ matrix.attempt }}
          path: |
            boot-failure.png
            boot-failure-logcat.txt
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Is the pre-frame hang Impeller/Vulkan bring-up?
  #
  # Builds a second debug APK from an ephemeral checkout with
  # io.flutter.embedding.android.EnableImpeller=false injected by
  # tools/patch_disable_impeller.py, then boots it on the oldest and newest API
  # levels that have a working emulator image. Nothing here is shipped: the
  # committed manifest is never touched, so the released APK keeps Flutter's
  # default rasterizer. Reading the result needs both legs — an Impeller-off
  # build that fails on API 34 too means the opt-out is not a safe fallback,
  # while one that boots on both means it is available if the field report from
  # the native watchdog confirms a rasterizer hang.
  build-impeller-off:
    name: Build Impeller-off diagnostic APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK components
        run: tools/ci_run.sh sdkmanager 'platforms;android-34' 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.3.13750724'
      - name: Resolve Flutter packages
        working-directory: mobile
        run: ../tools/ci_run.sh flutter pub get
      - name: Fetch verified Gradle distribution
        run: tools/ci_run.sh tools/fetch_gradle_ci.sh
      - name: Inject the Impeller opt-out
        run: tools/ci_run.sh python3 tools/patch_disable_impeller.py
      - name: Build the diagnostic APK
        working-directory: mobile
        run: ../tools/ci_run.sh flutter build apk --debug --no-pub --target-platform android-x64
      - name: Confirm the opt-out reached the built manifest
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump xmltree \
            --file AndroidManifest.xml mobile/build/app/outputs/flutter-apk/app-debug.apk \
            | grep -A2 -F 'io.flutter.embedding.android.EnableImpeller'
      - uses: actions/upload-artifact@v4
        with:
          name: impeller-off-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Two APKs the field report actually needs, built on ONE runner so they share a
  # debug signing key and the phone can move between them without uninstalling
  # (release builds here are signed with signingConfigs.debug, so debug and
  # release from the same runner are mutually installable).
  #
  # Why these two: the 2026-11-17 diagnostic run on the reporting Pixel 8 Pro
  # (Android 17, Mali-G715, WebView 157.0.8103.38) moved the bug. Flutter paints
  # its first frame in ~1.1 s, the watchdog disarms itself, the loopback asset
  # server answers HTTP 200 for index.html, the WebView loads the page (its
  # .loading overlay was captured on screen at t=30s) and the game runs (pid 11905
  # Chromium audio warnings). Yet by t=45s the screen is a single flat colour,
  # #0A1A44 - which is Flutter's Scaffold / the Android window background, NOT the
  # web page, because hud.css sets `html, body { background: #000 }`. So the game
  # is alive behind a platform view that stopped reaching the display once the
  # WebGL canvas became the only content.
  #
  # No emulator can test that: they have no Mali GPU and no API 37 image, and the
  # CI boot test only checks for the first *Flutter* frame, which this device
  # passes. The two candidates are the rasterizer and hybrid-composition platform
  # views, so ship one APK per candidate:
  #   arm64 release, Impeller OFF -> if the game appears, the rasterizer is it
  #   arm64 debug,   Impeller ON  -> kDebugMode makes the WebView inspectable, so
  #                                  chrome://inspect can read the console and the
  #                                  canvas state on the real device
  # The committed manifest is still never modified: the opt-out is injected into
  # this ephemeral checkout and reverted in the same job, and the normal release
  # APK built by `build` keeps Flutter's default rasterizer.
  build-field-apks:
    name: Build on-device diagnostic APKs (arm64)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: build
    permissions:
      contents: write # only used by the opt-in upload step below
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK components
        run: tools/ci_run.sh sdkmanager 'platforms;android-34' 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.3.13750724'
      - name: Resolve Flutter packages
        working-directory: mobile
        run: ../tools/ci_run.sh flutter pub get
      - name: Fetch verified Gradle distribution
        run: tools/ci_run.sh tools/fetch_gradle_ci.sh
      - name: Build arm64 debug APK with an inspectable WebView
        working-directory: mobile
        run: ../tools/ci_run.sh flutter build apk --debug --no-pub --target-platform android-arm64
      - name: Inject the Impeller opt-out
        run: tools/ci_run.sh python3 tools/patch_disable_impeller.py
      - name: Build arm64 release APK with Impeller disabled
        working-directory: mobile
        run: ../tools/ci_run.sh flutter build apk --release --no-pub --target-platform android-arm64
      - name: Confirm the opt-out reached the built manifest
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump xmltree \
            --file AndroidManifest.xml mobile/build/app/outputs/flutter-apk/app-release.apk \
            | grep -A2 -F 'io.flutter.embedding.android.EnableImpeller'
      - name: Stage both APKs and restore the manifest
        run: |
          mkdir -p field
          cp mobile/build/app/outputs/flutter-apk/app-debug.apk field/tanuki-rush-arm64-debug-inspectable.apk
          cp mobile/build/app/outputs/flutter-apk/app-release.apk field/tanuki-rush-arm64-release-impeller-off.apk
          # Prove the injection never escaped this job.
          git checkout -- mobile/android/app/src/main/AndroidManifest.xml
          git diff --exit-code -- mobile/android/app/src/main/AndroidManifest.xml
          grep -c 'EnableImpeller' mobile/android/app/src/main/AndroidManifest.xml || echo "manifest clean: no EnableImpeller key"
          sha256sum field/*.apk > field/SHA256SUMS-field.txt
          ls -lh field
      - uses: actions/upload-artifact@v4
        with:
          name: field-diagnostic-apks
          path: field/*
          if-no-files-found: error
          retention-days: 30
      - name: Attach both APKs to the requested pre-release
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release-preview]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="preview-${GITHUB_SHA:0:10}"
          # The build job owns release creation; wait for it rather than racing it.
          for _ in $(seq 1 40); do
            gh release view "$tag" >/dev/null 2>&1 && break
            sleep 15
          done
          gh release view "$tag" >/dev/null 2>&1 || { echo "::error::release $tag never appeared, so the field APKs were not attached"; exit 1; }
          gh release upload "$tag" \
            field/tanuki-rush-arm64-debug-inspectable.apk \
            field/tanuki-rush-arm64-release-impeller-off.apk \
            field/SHA256SUMS-field.txt --clobber

  boot-impeller-off:
    name: Impeller-off boot test (API ${{ matrix.api }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: build-impeller-off
    strategy:
      fail-fast: false
      matrix:
        api: [34, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - uses: actions/download-artifact@v4
        with:
          name: impeller-off-apk
          path: apk
      - name: Boot smoke test with Impeller disabled (API ${{ matrix.api }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          script: BOOT_TEST_APK=apk/app-debug.apk tools/ci_boot_test.sh
      - name: Upload Impeller-off failure diagnostics (API ${{ matrix.api }})
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: boot-failure-impeller-off-api-${{ matrix.api }}
          path: |
            boot-failure.png
            boot-failure-logcat.txt
          if-no-files-found: ignore
          retention-days: 14
