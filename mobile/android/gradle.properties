# Sized for a 4 GB build container. The Flutter template asks for -Xmx8G, which
# gets the Gradle daemon OOM-killed mid-build and surfaces as a misleading
# "Gradle build daemon disappeared unexpectedly" message.
org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=192m

# One worker queue: this project has a single module, and every extra JVM
# competes for the same 4 GB.
org.gradle.parallel=false
org.gradle.workers.max=2

# Run the Kotlin compiler inside the Gradle JVM instead of spawning a second
# daemon that immediately competes for memory.
kotlin.compiler.execution.strategy=in-process

# Do not silently download multi-gigabyte SDK components (the NDK is ~1.9 GB
# unpacked); missing pieces should fail loudly instead.
android.builder.sdkDownload=false

android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
