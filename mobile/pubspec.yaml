name: tanuki_rush
description: "Native Android shell that plays TANUKI RUSH offline, with no browser and no network."
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  # Version is pinned by `flutter pub add` — see pubspec.lock for the resolved one.
  flutter_inappwebview: ^6.1.5
  # Local streak reminder (no server). timezone is required for zonedSchedule.
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Flutter asset directory declarations are NOT recursive, so each level of the
  # compiled web build is listed explicitly. asset_index.json (generated by
  # tools/build_web_assets.py) is what the in-app server actually serves from.
  assets:
    - assets/web/
    - assets/web/assets/
    - assets/web/fonts/
